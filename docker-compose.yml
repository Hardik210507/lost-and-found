services:
  # 1. Spring Boot Backend Service (Connected to Supabase PostgreSQL)
  backend:
    build:
      context: ./lost-and-found-backend
      dockerfile: Dockerfile
    container_name: lost_and_found_backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: ${SUPABASE_DB_URL:-jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?sslmode=require}
      SPRING_DATASOURCE_USERNAME: ${SUPABASE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SUPABASE_DB_PASSWORD:-YOUR_SUPABASE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173,http://localhost:80
      PORT: 8080
    ports:
      - "8080:8080"

  # 2. React Frontend Service (Nginx)
  frontend:
    build:
      context: ./lost-and-found-frontend
      dockerfile: Dockerfile
    container_name: lost_and_found_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
